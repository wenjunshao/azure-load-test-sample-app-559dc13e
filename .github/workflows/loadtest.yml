


jobs:
  # This workflow consists of a single job called "loadtest"








  loadtest:








    runs-on: ubuntu-latest








    steps:
      - uses: actions/checkout@v4








      #Login in your azure subscription using OpenID Connect (credentials stored as GitHub secrets in repo)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}








      # Run the load test
      - name: Azure Load Testing
        # Pinning the action to a specific commit SHA to avoid breaking changes in the future.
        uses: azure/load-testing@ce6fe8a43177293d8f288123dc628038d2849bbb # Node 24-compatible commit
        with:
          loadTestConfigFile: 'config.yaml'
          loadTestResource: ${{ env.LOAD_TEST_RESOURCE}}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          env: |
            [
              {
              "name": "webapp",
              "value": "${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
              }
            ]








      # upload the published website code artifacts
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: loadTestResults
          path: ${{github.workspace}}/loadTest















