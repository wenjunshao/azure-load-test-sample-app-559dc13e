name: Load test


on: [workflow_dispatch]


permissions:
  id-token: write # Require write permission to fetch an OIDC token.
  contents: read # Required for actions/checkout.


env:
  # Enter only the Azure web app name, not its full URL.
  RESOURCE_GROUP: az2006-rg
  LOAD_TEST_RESOURCE: az2006loadtest
  AZURE_WEB_APP: az2006app26219
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'


jobs:
  loadtest:
    runs-on: ubuntu-latest


    steps:
      - uses: actions/checkout@v4


      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      - name: Azure Load Testing
        # Pinning the action to a specific commit SHA to avoid breaking changes.
        uses: azure/load-testing@5c5d948af73990aa1c0732e255897d1b1b4c0e7b # v1.2.5
        with:
          loadTestConfigFile: 'config.yaml'
          loadTestResource: ${{ env.LOAD_TEST_RESOURCE }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          env: |
            [
              {
                "name": "webapp",
                "value": "${{ env.AZURE_WEB_APP }}.azurewebsites.net"
              }
            ]


      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: loadTestResults
          path: ${{ github.workspace }}/loadTest

